<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment - Sole Street</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <nav class="navbar">
    <a class="logo" href="index.html">SOLE<span>STREET</span></a>
    <div class="nav-links">
      <a href="index.html">Home</a><a href="products.html">Products</a>
      <a href="cart.html">Cart (<span class="cart-count">0</span>)</a>
    </div>
  </nav>
</header>

<main class="page">
  <div class="page-heading">
    <p class="small-title">CHECKOUT</p>
    <h1>Payment Details</h1>
  </div>

  <div class="checkout-layout">
    <form id="payment-form" class="payment-form">
      <h2>Customer Information</h2>

      <label>Full Name
        <input type="text" id="name" placeholder="Enter your full name">
      </label>
      <label>Email
        <input type="email" id="email" placeholder="example@email.com">
      </label>
      <label>Phone Number
        <input type="tel" id="phone" placeholder="10 digit mobile number" maxlength="10">
      </label>
      <label>Delivery Address
        <textarea id="address" placeholder="Enter your complete address"></textarea>
      </label>

      <h2>Card Information</h2>
      <label>Card Number
        <input type="text" id="card" placeholder="16 digit card number" maxlength="16">
      </label>
      <div class="two-inputs">
        <label>Expiry Date
          <input type="text" id="expiry" placeholder="MM/YY" maxlength="5">
        </label>
        <label>CVV
          <input type="password" id="cvv" placeholder="3 digits" maxlength="3">
        </label>
      </div>

      <p id="payment-message" class="message"></p>
      <button type="submit" class="btn full-btn">Place Order</button>
    </form>

    <aside id="payment-summary" class="summary"></aside>
  </div>
</main>

<footer><p>© 2026 Sole Street | AAT-1 Full Stack Web Development</p></footer>
<script src="js/script.js"></script>
</body>
</html>
